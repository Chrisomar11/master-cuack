<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campeonato de Starcraft 2 - Master-Cuack</title>
    <style>
        :root {
            --bg-color: #1a1c23;
            --panel-bg: #242834;
            --primary-accent: #4f46e5;
            --sc2-blue: #00cdff;
            --text-main: #e2e8f0;
            --border-color: #3b4252;
            --match-win: rgba(74, 222, 128, 0.2);  
            --match-win-text: #4ade80;
            --match-lose: rgba(248, 113, 113, 0.2); 
            --match-lose-text: #f87171;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        h1 {
            color: var(--sc2-blue);
            text-align: center;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(0, 205, 255, 0.3);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .tables-wrapper {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        @media (min-width: 900px) {
            .tables-wrapper { grid-template-columns: 2fr 1fr; }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: rgba(30, 34, 45, 0.6);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        th, td {
            padding: 12px 14px;
            text-align: center;
            border: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        th {
            background-color: #2e3440;
            color: var(--sc2-blue);
            font-weight: 600;
            text-transform: uppercase;
        }

        .row-player {
            background-color: #292f3d;
            font-weight: bold;
            color: #fff;
            text-align: left;
        }

        .col-header-player { background-color: #3b4252; color: #fff !important; }

        .highlight-totals {
            background-color: rgba(79, 70, 229, 0.15);
            font-weight: bold;
            color: #57f9a3;
        }

        .ranking-table th { background-color: #1f232a; color: #ffb52a; }
        .ranking-table td { font-weight: bold; }
        .history-table th { background-color: #2b303c; }
        .history-table tr:nth-child(even) { background-color: rgba(255,255,255,0.02); }

        .same-player-cell {
            background-color: #1e222d;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.03) 10px, rgba(255,255,255,0.03) 20px);
        }

        .btn-replay {
            display: inline-block;
            background-color: var(--primary-accent);
            color: white;
            padding: 6px 12px;
            font-size: 0.85rem;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Campeonato de Starcraft 2 &lt;Master-Cuack&gt;</h1>

    <div class="tables-wrapper">
        <!-- MATRIZ PRINCIPAL -->
        <div>
            <table id="matriz-competidores">
                <thead>
                    <tr>
                        <th class="col-header-player">PLAYERS</th>
                        <th>Astor</th>
                        <th>Evangelyon</th>
                        <th>Fer</th>
                        <th>Gladiator</th>
                        <th>Goku2001</th>
                        <th>Snake</th>
                        <th>Vergatron</th>
                        <th style="color: #57f9a3;">Victorias</th>
                        <th style="color: #57f9a3;">Puntos</th>
                    </tr>
                </thead>
                <tbody id="matriz-body">
                    <!-- El motor de JS autogenerará las filas matemáticas aquí -->
                </tbody>
            </table>
        </div>

        <!-- RANKING EN TIEMPO REAL -->
        <div>
            <table class="ranking-table">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Ranking Oficial</th>
                    </tr>
                </thead>
                <tbody id="ranking-body"></tbody>
            </table>
        </div>
    </div>

    <!-- HISTORIAL DE PARTIDOS -->
    <div class="tables-wrapper" style="margin-top: 40px; grid-template-columns: 1fr;">
        <div>
            <h3 style="color: var(--sc2-blue); text-transform: uppercase; font-size: 1.1rem; margin-bottom: 15px;">Historial de Enfrentamientos Directos</h3>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Winner</th>
                        <th>Loser</th>
                        <th>Partido</th>
                        <th>Replays</th>
                    </tr>
                </thead>
                <tbody id="history-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const listaJugadores = ["Astor", "Evangelyon", "Fer", "Gladiator", "Goku2001", "Snake", "Vergatron"];
    
    // ⚠️ REEMPLAZA ESTE ENLACE ENTRE COMILLAS POR EL ENLACE .CSV QUE COPIASTE EN EL PASO 2 ⚠️
    const URL_GOOGLE_SHEETS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS2Sw3bvIa3GNYWiozPUo2LLg081ZuT1F3YaGzUaD3joXzRkqcJNpwtC1vM6tsmbUpyMOhoXJM3LRd_/pub?output=csv";
    async function cargarDatosDesdeGoogle() {
        try {
            const respuesta = await fetch(URL_GOOGLE_SHEETS);
            const textoCSV = await respuesta.text();
            
            // Convertir las líneas del CSV en un objeto legible por JavaScript
            const lineas = textoCSV.split("\n");
            let partidas = [];
            
            for (let i = 1; i < lineas.length; i++) {
                if (!lineas[i].trim()) continue;
                const columnas = lineas[i].split(",");
                
                // Asegurar la correcta extracción de columnas del Excel limpiando comillas dobles
                partidas.push({
                    winner: columnas[0].replace(/"/g, "").trim(),
                    loser: columnas[1].replace(/"/g, "").trim(),
                    partido: columnas[2].replace(/"/g, "").trim(),
                    replay: columnas[3] ? columnas[3].replace(/"/g, "").trim() : "#"
                });
            }

            procesarYRenderizar(partidas);
        } catch (error) {
            console.error("Error cargando los datos del torneo desde Google Sheets: ", error);
        }
    }

    function procesarYRenderizar(partidas) {
        // Ajustar anchos fijos de columnas para perfecta simetría visual
        const columnasCabecera = document.querySelectorAll("#matriz-competidores thead th");
        for (let j = 1; j <= 7; j++) {
            if(columnasCabecera[j]) {
                columnasCabecera[j].style.width = "90px";
                columnasCabecera[j].style.minWidth = "90px";
            }
        }

        let estadisticas = {};
        let matrizVersus = {};

        listaJugadores.forEach(j => {
            estadisticas[j] = { victorias: 0, puntos: 0 };
            matrizVersus[j] = {};
            listaJugadores.forEach(rival => {
                matrizVersus[j][rival] = { ganados: 0, perdidos: 0 };
            });
        });

        // 1. Mapear todo el historial de enfrentamientos del Excel a la matriz balanceada
        partidas.forEach(p => {
            if (estadisticas[p.winner] && estadisticas[p.loser]) {
                matrizVersus[p.winner][p.loser].ganados++;
                matrizVersus[p.loser][p.winner].perdidos++;
            }
        });

        // 2. Calcular puntos según tus nuevas reglas basadas en el marcador acumulado final contra cada rival
        listaJugadores.forEach(jugador => {
            listaJugadores.forEach(rival => {
                if (jugador !== rival) {
                    const juego = matrizVersus[jugador][rival];
                    
                    // Si el jugador de la fila le ganó al de la columna
                    if (juego.ganados > juego.perdidos) {
                        estadisticas[jugador].victorias++; // Registra la victoria global
                        
                        // REGLAS MATEMÁTICAS SOLICITADAS:
                        if (juego.ganados === 2 && juego.perdidos === 0) {
                            estadisticas[jugador].puntos += 3; // Victoria 2-0 da 3 Puntos
                        } else if (juego.ganados === 2 && juego.perdidos === 1) {
                            estadisticas[jugador].puntos += 2; // Victoria 2-1 da 2 Puntos
                        } else if (juego.ganados === 1 && juego.perdidos === 0) {
                            estadisticas[jugador].puntos += 1; // Victoria 1-0 da 1 Punto
                        } else {
                            estadisticas[jugador].puntos += 1; // Respaldo por defecto
                        }
                    }
                }
            });
        });

        // 3. Renderizar la Matriz de posiciones en base a los cálculos
        const matrizBody = document.getElementById("matriz-body");
        matrizBody.innerHTML = "";

        listaJugadores.forEach(jugador => {
            const tr = document.createElement("tr");
            let HTMLFilas = `<td class="row-player">${jugador}</td>`;
            
            listaJugadores.forEach(rival => {
                if (jugador === rival) {
                    HTMLFilas += `<td class="same-player-cell"></td>`;
                } else {
                    const juego = matrizVersus[jugador][rival];
                    if (juego.ganados === 0 && juego.perdidos === 0) {
                        HTMLFilas += `<td></td>`;
                    } else {
                        const marcador = `${juego.ganados}-${juego.perdidos}`;
                        const estilo = juego.ganados > juego.perdidos 
                            ? `style="background-color: var(--match-win); color: var(--match-win-text); font-weight: bold;"` 
                            : `style="background-color: var(--match-lose); color: var(--match-lose-text);"`;
                        HTMLFilas += `<td ${estilo}>${marcador}</td>`;
                    }
                }
            });

            HTMLFilas += `<td class="highlight-totals">${estadisticas[jugador].victorias}</td>`;
            HTMLFilas += `<td class="highlight-totals">${estadisticas[jugador].puntos}</td>`;
            
            tr.innerHTML = HTMLFilas;
            matrizBody.appendChild(tr);
        });

        // 4. Renderizar Historial abajo (Leyendo los links reales agregados en Sheets)
        const historyBody = document.getElementById("history-body");
        historyBody.innerHTML = "";
        partidas.forEach(p => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${p.winner}</td>
                <td>${p.loser}</td>
                <td>${p.partido}</td>
                <td><a class="btn-replay" href="${p.replay}" target="_blank">Ver Replay</a></td>
            `;
            historyBody.appendChild(tr);
        });

        // 5. Renderizar Ranking Dinámico con Corona para el Líder
        let podio = Object.keys(estadisticas).map(name => ({ name, puntos: estadisticas[name].puntos }));
        podio.sort((a,b) => b.puntos - a.puntos);

        const rankingBody = document.getElementById("ranking-body");
        rankingBody.innerHTML = "";
        podio.forEach((j, index) => {
            const tr = document.createElement("tr");
            let colorPos = "#fff";
            let corona = "";

            if(index === 0) { colorPos = "#ffd700"; corona = " <span style='color: #ffd700; margin-left:5px;'>👑</span>"; }
            if(index === 1) colorPos = "#c0c0c0";
            if(index === 2) colorPos = "#cd7f32";

            tr.innerHTML = `
                <td style="color: ${colorPos}">${index+1}°</td>
                <td style="text-align: left; padding-left: 20px; color: ${index === 0 ? '#ffd700' : '#fff'}">${j.name}${corona}</td>
            `;
            rankingBody.appendChild(tr);
        });
    }

    document.addEventListener("DOMContentLoaded", cargarDatosDesdeGoogle);
</script>
